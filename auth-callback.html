<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Bolify</title>
  <style>
    :root { --bg:#0F1017; --card:#181A24; --border:#2A2F45; --text:#FFFFFF; --muted:#9CA3AF; --gold:#FFC24B; --red:#F87171; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
           background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
    .card { width:100%; max-width:440px; background:var(--card); border:1px solid var(--border); border-radius:20px; padding:32px 24px; text-align:center; }
    .brand { font-weight:800; letter-spacing:3px; color:var(--gold); font-size:22px; margin-bottom:22px; }
    .icon { font-size:46px; line-height:1; margin-bottom:14px; }
    h1 { font-size:22px; margin:0 0 10px; }
    p { color:var(--muted); line-height:1.55; font-size:15px; margin:0 0 14px; }
    .btn { display:inline-block; margin-top:8px; background:var(--gold); color:#000; font-weight:700; text-decoration:none;
           padding:14px 26px; border-radius:14px; font-size:16px; }
    .link { display:block; margin-top:16px; color:var(--gold); font-size:14px; }
    .hidden { display:none; }
    .error h1 { color:var(--red); }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="brand">BOLIFY</div>
    <div class="icon" id="icon">&#9203;</div>
    <h1 id="title">Opening Bolify...</h1>
    <p id="message">Please wait a moment.</p>
    <a id="openApp" class="btn hidden" href="#">Open Bolify</a>
    <a id="store" class="link hidden" href="https://play.google.com/store/apps/details?id=com.bloobeach.bolify">Get Bolify on Google Play</a>
  </div>

  <script>
    (function () {
      var PACKAGE = 'com.bloobeach.bolify';
      var SCHEME = 'io.supabase.bolify';
      var STORE = 'https://play.google.com/store/apps/details?id=' + PACKAGE;

      var query = new URLSearchParams(window.location.search);
      var hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      var flow = query.get('flow') || hash.get('type') || 'signup';
      var isReset = flow === 'reset' || flow === 'recovery';
      var error = hash.get('error_description') || query.get('error_description') ||
                  hash.get('error') || query.get('error');
      var ua = navigator.userAgent || '';
      var isAndroid = /Android/i.test(ua);
      var isIOS = /iPhone|iPad|iPod/i.test(ua);

      var el = function (id) { return document.getElementById(id); };
      function show(icon, title, message) {
        el('icon').innerHTML = icon;
        el('title').textContent = title;
        el('message').textContent = message;
      }

      // 1. Expired, already used or invalid link.
      if (error) {
        document.getElementById('card').className += ' error';
        show('&#9888;&#65039;', 'This link has expired',
          isReset
            ? 'This reset link was already used or is too old. Open Bolify on your phone, tap Sign In, then Forgot Password, to get a new link.'
            : 'This link was already used or is too old. Open Bolify on your phone and sign in. If it says your email is not confirmed, sign up again to get a new link.');
        el('store').classList.remove('hidden');
        return;
      }

      // 2. On a phone: hand the link to the app.
      var path = isReset ? 'reset-password' : 'auth-callback';
      var appLink = SCHEME + '://' + path + window.location.search;
      if (isAndroid) {
        var intentLink = 'intent://' + path + window.location.search +
          '#Intent;scheme=' + SCHEME + ';package=' + PACKAGE +
          ';S.browser_fallback_url=' + encodeURIComponent(STORE) + ';end';
        el('openApp').href = intentLink;
        el('openApp').classList.remove('hidden');
        el('store').classList.remove('hidden');
        show('&#128241;', isReset ? 'Opening Bolify to reset your password' : 'Email confirmed! Opening Bolify',
          'If Bolify does not open by itself, tap the button below.');
        window.location.href = intentLink;
        return;
      }
      if (isIOS) {
        el('openApp').href = appLink;
        el('openApp').classList.remove('hidden');
        show('&#128241;', 'Open Bolify', 'Tap the button below to continue in the app.');
        return;
      }

      // 3. On a computer: explain what to do next.
      el('store').classList.remove('hidden');
      if (isReset) {
        show('&#128274;', 'Open this link on your phone',
          'Password reset works only in the Bolify app. On your phone, open Bolify, tap Sign In, then Forgot Password, and open the new email there.');
      } else {
        show('&#127881;', 'Your email is confirmed!',
          'You can close this page. Open the Bolify app on your phone and sign in with your email and password.');
      }
    })();
  </script>
</body>
</html>
